name: RPL PRO 9 - Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, principal]
    paths:
      - '**'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verificar projeto
        run: |
          test -f package.json
          test -f www/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dependencias e PDF offline
        working-directory: .
        run: |
          npm install --no-audit --no-fund
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/jspdf.umd.min.js
      - name: Preparar Android
        working-directory: .
        run: |
          npx cap add android
          npx cap sync android
          cp native/*.java android/app/src/main/java/br/com/rpl/orcamentos/
          for d in android/app/src/main/res/mipmap-*; do
            rm -f "$d/ic_launcher.webp" "$d/ic_launcher_round.webp"
            cp native/icon.png "$d/ic_launcher.png"
            cp native/icon.png "$d/ic_launcher_round.png"
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
          sed -i 's/versionCode 1/versionCode 9/;s/versionName "1.0"/versionName "9.0"/' android/app/build.gradle
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RPL-Orcamentos-PRO-9-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
